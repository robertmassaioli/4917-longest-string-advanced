name: C implementation
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  c-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: c-impl
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: ctest --preset debug
      - run: cmake --preset sanitizers
      - run: cmake --build --preset sanitizers
      - run: ctest --preset sanitizers
  haskell-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
      - run: cmake -S c-impl -B c-impl/build/differential -DI4917_ENABLE_HASKELL_DIFFERENTIAL=ON
      - run: cmake --build c-impl/build/differential
      - run: ctest --test-dir c-impl/build/differential --output-on-failure
        timeout-minutes: 20
  haskell-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
      - run: stack test
        working-directory: haskell-impl
        timeout-minutes: 20

  c-quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned formatting and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang-format-18=1:18.1.3-1ubuntu1 \
            cppcheck=2.13.0-2ubuntu3
      - name: Check C formatting
        run: CLANG_FORMAT=clang-format-18 c-impl/scripts/format-c.sh --check
      - name: Configure C compilation database
        run: >-
          cmake -S c-impl -B c-impl/build/cppcheck
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DI4917_BUILD_BENCHMARKS=ON
      - name: Run Cppcheck
        run: c-impl/scripts/check-cppcheck.sh
